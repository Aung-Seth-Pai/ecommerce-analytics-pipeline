[project]
name = "ecommerce-analytics-pipeline"
version = "0.1.0"
description = "End-to-end analytics pipeline on BigQuery with dbt, a batch simulator and a Looker Studio dashboard."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt>=2.0.8",
    "duckdb>=1.5.6",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-bigquery-storage>=2.42.0",
    "pyarrow>=26.0.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
notebook = [
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "pandas-gbq>=0.35.2",
    "db-dtypes>=1.8.0",
    "python-dotenv>=1.2.4",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
]
