version: 2

models:
  - name: int_users_web_activity
    description: "One row per user with at least one event: their site activity, summarised from their sessions. Browser and traffic source come from sessions, where each is the same for every event."
    columns:
      - name: user_id
        description: "User id."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_users_current')
                field: user_id
      - name: first_seen_at
        description: "Start of the user's first session."
      - name: last_seen_at
        description: "Last event of the user's latest session."
      - name: session_count
        description: "Number of sessions."
      - name: event_count
        description: "Number of events."
      - name: primary_browser
        description: "The browser of most of the user's sessions; on a tie, the browser of the most recent one."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Chrome', 'Firefox', 'IE', 'Other', 'Safari']
      - name: first_session_traffic_source
        description: "Traffic source of the user's first session."
      - name: last_session_traffic_source
        description: "Traffic source of the user's latest session."

  - name: int_orders_current
    description: "Latest version of each order: one row per order_id. Deleted orders are kept, flagged by is_deleted."
    columns:
      - name: order_id
        description: "Order id."
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: "The user who placed the order."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_users_current')
                field: user_id
      - name: is_deleted
        description: "True when the latest version is a delete (_op = 'D')."
        data_tests:
          - not_null

  - name: int_order_items_current
    description: "Latest version of each order item: one row per order_item_id. Deleted items are kept, flagged by is_deleted."
    columns:
      - name: order_item_id
        description: "Order item id."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "The order this item belongs to."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_orders_current')
                field: order_id
      - name: user_id
        description: "The user who placed the order."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_users_current')
                field: user_id
      - name: product_id
        description: "The product sold."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_products_current')
                field: product_id
      - name: inventory_item_id
        description: "The stock unit sold."
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('int_inventory_items_current')
                field: inventory_item_id
      - name: is_deleted
        description: "True when the latest version is a delete (_op = 'D')."
        data_tests:
          - not_null

  - name: int_users_current
    description: "Latest version of each user: one row per user_id. Deleted users are kept, flagged by is_deleted."
    columns:
      - name: user_id
        description: "User id."
        data_tests:
          - unique
          - not_null
      - name: is_deleted
        description: "True when the latest version is a delete (_op = 'D')."
        data_tests:
          - not_null

  - name: int_products_current
    description: "Latest version of each product: one row per product_id. Deleted products are kept, flagged by is_deleted."
    columns:
      - name: product_id
        description: "Product id."
        data_tests:
          - unique
          - not_null
      - name: distribution_center_id
        description: "The distribution center that stocks the product."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_distribution_centers_current')
                field: distribution_center_id
      - name: is_deleted
        description: "True when the latest version is a delete (_op = 'D')."
        data_tests:
          - not_null

  - name: int_inventory_items_current
    description: "Latest version of each stock unit: one row per inventory_item_id. Deleted units are kept, flagged by is_deleted."
    columns:
      - name: inventory_item_id
        description: "Inventory item id."
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "The product this unit is."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_products_current')
                field: product_id
      - name: is_deleted
        description: "True when the latest version is a delete (_op = 'D')."
        data_tests:
          - not_null

  - name: int_distribution_centers_current
    description: "Latest version of each distribution center: one row per distribution_center_id. Deleted centers are kept, flagged by is_deleted."
    columns:
      - name: distribution_center_id
        description: "Distribution center id."
        data_tests:
          - unique
          - not_null
      - name: is_deleted
        description: "True when the latest version is a delete (_op = 'D')."
        data_tests:
          - not_null

  - name: int_order_items_joined
    description: "One row per order item, from current state, with its order's status and creation time, its stock unit's cost and distribution center, and the straight-line distance from that center to the user. Deleted items, and items of deleted orders, are kept and flagged by is_deleted."
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_order_items_current')
    columns:
      - name: order_item_id
        description: "Order item id."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "The order this item belongs to."
        data_tests:
          - not_null
      - name: distribution_center_id
        description: "The distribution center of the stock unit sold."
        data_tests:
          - not_null
      - name: unit_cost
        description: "What the sold stock unit cost the shop."
        data_tests:
          - not_null
      - name: shipping_distance_km
        description: "Great-circle (straight-line) distance in km from the stock unit's distribution center to the user's current address. Not the road or shipping route."
        data_tests:
          - not_null
      - name: order_created_at
        description: "When the item's order was placed."
        data_tests:
          - not_null
      - name: is_deleted
        description: "True when the item or its order is deleted."
        data_tests:
          - not_null

  - name: int_orders_enriched
    description: "One row per order from current state, with the order's own milestone timestamps and counts, money and distribution center count rolled up from its non-deleted items. Item timestamps are not rolled up. Deleted orders are kept, flagged by is_deleted."
    columns:
      - name: order_id
        description: "Order id."
        data_tests:
          - unique
          - not_null
      - name: user_order_number
        description: "The order's position among the user's non-deleted orders by order time, 1 for the first; ties broken by order_id. Cancelled orders count. Null for deleted orders."
      - name: is_deleted
        description: "True when the order's latest version is a delete."
        data_tests:
          - not_null
      - name: is_return_window_closed
        description: "True when the order was delivered at least return_window_days before the data cutoff, so its return outcome is final."
        data_tests:
          - not_null
      - name: is_returned_within_window
        description: "True when the order was returned within return_window_days of delivery."
        data_tests:
          - not_null
      - name: is_delivery_window_closed
        description: "True when the order was placed at least delivery_window_days before the data cutoff, so its delivery outcome is final."
        data_tests:
          - not_null

  - name: int_users_order_history
    description: "One row per user with at least one non-deleted order: their order history on current state. Overwritten as the user keeps ordering."
    columns:
      - name: user_id
        description: "User id."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_users_current')
                field: user_id
      - name: first_order_at
        description: "When the user placed their first order."
      - name: last_order_at
        description: "When the user placed their latest order."
      - name: order_count
        description: "Orders placed, cancelled ones included."
      - name: cancelled_order_count
        description: "Orders placed and then cancelled."
      - name: lifetime_net_sales
        description: "Sum of the orders' net_sales, in USD: items neither cancelled nor returned, on current state."

  - name: int_data_cutoff
    description: "One row: data_cutoff_at, the end of the latest loaded batch window across orders, order items, users and events. The data's own 'now', used for maturity rules instead of the current date."
    columns:
      - name: data_cutoff_at
        description: "Exclusive end of all loaded data (midnight UTC of the latest _batch_date)."
        data_tests:
          - not_null

unit_tests:
  - name: current_state_keeps_the_latest_version_of_each_order
    description: >
      Order 1 has three versions; the last two share a _source_updated_at, so the later batch wins.
      Order 2's latest version is a delete, so it is kept and flagged.
    model: int_orders_current
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, order_status: Processing, _op: I, _source_updated_at: "2019-02-20 10:00:00", _batch_id: 1, _seq: 1}
          - {order_id: 1, order_status: Shipped,    _op: U, _source_updated_at: "2019-02-22 09:00:00", _batch_id: 3, _seq: 1}
          - {order_id: 1, order_status: Complete,   _op: U, _source_updated_at: "2019-02-22 09:00:00", _batch_id: 4, _seq: 2}
          - {order_id: 2, order_status: Processing, _op: I, _source_updated_at: "2019-02-20 11:00:00", _batch_id: 1, _seq: 2}
          - {order_id: 2, order_status: Processing, _op: D, _source_updated_at: "2019-02-21 08:00:00", _batch_id: 2, _seq: 1}
    expect:
      rows:
        - {order_id: 1, order_status: Complete,   is_deleted: false}
        - {order_id: 2, order_status: Processing, is_deleted: true}