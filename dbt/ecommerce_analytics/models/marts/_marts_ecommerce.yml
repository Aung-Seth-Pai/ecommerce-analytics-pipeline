version: 2

models:
  - name: fct_order_items
    description: >
      One row per order item that is not deleted: a transaction fact. Revenue (net_sale_price)
      counts an item only while it is neither cancelled nor returned, judged on its current state,
      so a later return lowers the revenue of the item's original order date. sale_price is what
      was ordered (gross). For revenue by the period in which money moved, use fct_sales_movements.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "net_sale_price <= sale_price"
    columns:
      - name: order_item_id
        description: "Order item id."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "The order the item belongs to (degenerate dimension)."
        data_tests:
          - not_null
      - name: user_id
        description: "The user who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: product_id
        description: "The product sold."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: distribution_center_id
        description: "The distribution center of the stock unit sold."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_distribution_centers')
                field: distribution_center_id
      - name: order_date
        description: "UTC date the order was placed."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: shipped_date
        description: "UTC date the item shipped; null if not shipped."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: delivered_date
        description: "UTC date the item was delivered; null if not delivered."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: returned_date
        description: "UTC date the item was returned; null if not returned."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: order_created_at
        description: "When the order was placed (UTC)."
      - name: shipped_at
        description: "When the item shipped (UTC)."
      - name: delivered_at
        description: "When the item was delivered (UTC)."
      - name: returned_at
        description: "When the item was returned (UTC)."
      - name: order_item_status
        description: "The item's current status."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Processing', 'Shipped', 'Complete', 'Returned', 'Cancelled']
      - name: sale_price
        description: "What the item sold for (gross), in USD."
        data_tests:
          - not_null
      - name: unit_cost
        description: "What the sold stock unit cost the shop, in USD."
        data_tests:
          - not_null
      - name: gross_margin
        description: "sale_price minus unit_cost, in USD."
      - name: net_sale_price
        description: "sale_price while the item is neither cancelled nor returned, else 0, in USD. The revenue measure."
        data_tests:
          - not_null
      - name: net_margin
        description: "gross_margin while the item is neither cancelled nor returned, else 0, in USD."
        data_tests:
          - not_null
      - name: shipping_distance_km
        description: "Great-circle (straight-line) distance in km from the stock unit's distribution center to the user's current address, in km. Not the road or shipping route. Aggregate by order_id as the analysis needs; an order is complete only when its farthest item arrives."

  - name: fct_sales_movements
    description: >
      One row per money movement on an order item: revenue by the date money moved. A sale is
      booked on the order date for +sale_price; a return is booked on the item's returned_at for
      -sale_price, a full refund. Cancelled items were never charged and have no rows. Each order
      item is one unit. Assumes payment at checkout, as there is no payment data.
    columns:
      - name: sales_movement_id
        description: "Movement id: one per order item and movement type."
        data_tests:
          - unique
          - not_null
      - name: order_item_id
        description: "The order item the money moved for."
        data_tests:
          - not_null
      - name: order_id
        description: "The order the item belongs to (degenerate dimension)."
        data_tests:
          - not_null
      - name: user_id
        description: "The user who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: product_id
        description: "The product sold."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: distribution_center_id
        description: "The distribution center of the stock unit sold."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_distribution_centers')
                field: distribution_center_id
      - name: movement_type
        description: "sale or return."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['sale', 'return']
      - name: movement_date
        description: "UTC date the money moved."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: movement_at
        description: "When the money moved (UTC)."
      - name: amount
        description: "Money in (+) or out (-), in USD."
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      One row per order that is not deleted: an accumulating snapshot. Milestones are the order's
      own timestamps, each with a date that joins dim_date; lags are in whole minutes and stay null
      until the later milestone happens. Item counts and money are rolled up from the order's items
      on current state, as in fct_order_items. There is no per-order distance: aggregate
      shipping_distance_km from fct_order_items as the analysis needs.
    columns:
      - name: order_id
        description: "Order id."
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: "The user who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: order_status
        description: "The order's current status."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Processing', 'Shipped', 'Complete', 'Returned', 'Cancelled']
      - name: user_order_number
        description: "The order's position among the user's orders by order time, 1 for the first. Cancelled orders count."
        data_tests:
          - not_null
      - name: order_date
        description: "UTC date the order was placed."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: shipped_date
        description: "UTC date the order shipped; null if not shipped."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: delivered_date
        description: "UTC date the order was delivered; null if not delivered."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: returned_date
        description: "UTC date the order was returned; null if not returned."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: order_created_at
        description: "When the order was placed (UTC)."
      - name: shipped_at
        description: "When the order shipped (UTC)."
      - name: delivered_at
        description: "When the order was delivered (UTC)."
      - name: returned_at
        description: "When the order was returned (UTC)."
      - name: minutes_to_ship
        description: "Whole minutes from order placed to shipped; null until shipped."
      - name: minutes_in_transit
        description: "Whole minutes from shipped to delivered; null until delivered."
      - name: minutes_to_deliver
        description: "Whole minutes from order placed to delivered; null until delivered."
      - name: minutes_to_return
        description: "Whole minutes from delivered to returned; null unless returned."
      - name: item_count
        description: "Number of items in the order."
        data_tests:
          - not_null
      - name: cancelled_item_count
        description: "Number of the order's items whose status is Cancelled."
        data_tests:
          - not_null
      - name: returned_item_count
        description: "Number of the order's items whose status is Returned."
        data_tests:
          - not_null
      - name: has_mixed_item_status
        description: "True when the order's items do not all share one status. Always false in thelook, where an order's items move together."
        data_tests:
          - not_null
      - name: distribution_center_count
        description: "Number of distribution centers the order's items ship from."
        data_tests:
          - not_null
      - name: gross_sale_amount
        description: "Sum of the items' sale_price (gross), in USD."
        data_tests:
          - not_null
      - name: gross_margin
        description: "Sum of the items' gross_margin, in USD."
      - name: net_sale_amount
        description: "Sum of the items' net_sale_price, in USD: items neither cancelled nor returned. The order's revenue."
        data_tests:
          - not_null
      - name: net_margin
        description: "Sum of the items' net_margin, in USD."

  - name: dim_date
    description: "One row per calendar day (UTC) from 2018-01-01 to 2028-12-31."
    columns:
      - name: date_day
        description: "The calendar day."
        data_tests:
          - unique
          - not_null
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: day
      - name: year
        description: "Calendar year."
      - name: quarter
        description: "Calendar quarter, 1 to 4."
      - name: year_quarter
        description: "Year and quarter, such as 2019-Q1."
      - name: month
        description: "Calendar month, 1 to 12."
      - name: month_name
        description: "Month name, such as February."
      - name: year_month
        description: "Year and month, such as 2019-02."
      - name: week_start_date
        description: "The Monday that starts the day's ISO week."
      - name: iso_week
        description: "ISO week number, 1 to 53."
      - name: day_of_month
        description: "Day of the month, 1 to 31."
      - name: day_of_year
        description: "Day of the year, 1 to 366."
      - name: day_of_week
        description: "ISO day of the week: 1 = Monday to 7 = Sunday."
      - name: day_name
        description: "Day name, such as Tuesday."
      - name: is_weekend
        description: "True on Saturday and Sunday."
      - name: is_last_day_of_month
        description: "True on the last day of its month."

  - name: dim_users
    description: "One row per user (current state). Personal data (names, email, street address) is left out. Deleted users are kept, flagged by is_deleted."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(session_count = 0) = (primary_browser is null)"
    columns:
      - name: user_id
        description: "User id."
        data_tests:
          - unique
          - not_null
      - name: age
        description: "Age in years."
      - name: age_band
        description: "Age group: Under 18, 18-24, 25-34, 35-44, 45-54, 55-64 or 65+."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Under 18', '18-24', '25-34', '35-44', '45-54', '55-64', '65+']
      - name: age_band_order
        description: "Sort order of age_band, 1 (Under 18) to 7 (65+)."
      - name: gender
        description: "Gender."
      - name: country
        description: "Country."
      - name: state
        description: "State or province of the address."
      - name: city
        description: "City."
      - name: postal_code
        description: "Postal code."
      - name: latitude
        description: "Latitude of the address."
      - name: longitude
        description: "Longitude of the address."
      - name: user_location
        description: "The address location as a geography point."
      - name: user_traffic_source
        description: "Traffic source recorded on the user."
      - name: user_created_at
        description: "When the account was created."
      - name: is_deleted
        description: "True when the user's latest version is a delete."
        data_tests:
          - not_null
      - name: first_seen_at
        description: "Start of the user's first session; null if the user has no events."
      - name: last_seen_at
        description: "Last event of the user's latest session; null if the user has no events."
      - name: session_count
        description: "Number of sessions; 0 if the user has no events."
        data_tests:
          - not_null
      - name: event_count
        description: "Number of events; 0 if the user has no events."
        data_tests:
          - not_null
      - name: primary_browser
        description: "The browser of most of the user's sessions; on a tie, the browser of the most recent one. Overwritten as the user keeps browsing."
      - name: first_session_traffic_source
        description: "Traffic source of the user's first session."
      - name: last_session_traffic_source
        description: "Traffic source of the user's latest session. Overwritten as the user keeps browsing."

  - name: dim_products
    description: "One row per product (current state). Deleted products are kept, flagged by is_deleted."
    columns:
      - name: product_id
        description: "Product id."
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name."
      - name: brand
        description: "Product brand."
      - name: category
        description: "Product category."
      - name: department
        description: "Product department."
      - name: sku
        description: "Stock keeping unit code."
      - name: retail_price
        description: "List price of the product, in USD."
      - name: product_cost
        description: "What the product costs the shop, in USD."
      - name: is_deleted
        description: "True when the product's latest version is a delete."
        data_tests:
          - not_null

  - name: dim_distribution_centers
    description: "One row per distribution center (current state). Deleted centers are kept, flagged by is_deleted."
    columns:
      - name: distribution_center_id
        description: "Distribution center id."
        data_tests:
          - unique
          - not_null
      - name: distribution_center_name
        description: "Name of the distribution center."
      - name: latitude
        description: "Latitude of the distribution center."
      - name: longitude
        description: "Longitude of the distribution center."
      - name: distribution_center_location
        description: "The location as a geography point."
      - name: is_deleted
        description: "True when the center's latest version is a delete."
        data_tests:
          - not_null