name: ecommerce_analytics

profile: ecommerce_analytics

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_analytics:
    +static_analysis: strict
  
      # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  return_window_days: 3      # thelook: every return is within 3 days of delivery
  delivery_window_days: 8    # thelook: every order is delivered within 8 days